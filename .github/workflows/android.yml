name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, screenshot checks, lint and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:verifyPaparazziDebug :app:lintDebug :app:assembleDebug :wear:assembleDebug --console=plain
      # Robolectric: the real Android framework on the JVM, against a fake Hermes. Its own
      # task, with a JVM per test class (see app/build.gradle.kts).
      - name: Integration tests (Robolectric)
        run: ./gradlew :app:integrationTestDebug :wear:testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conduit-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/wear/build/reports/
          if-no-files-found: ignore
